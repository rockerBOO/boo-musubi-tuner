[project]
name = "boo-musubi-tuner"
version = "0.1.0"
description = "Training extensions (self-flow, wavelet-loss, explorative-modeling) built on musubi-tuner as a library"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "musubi-tuner[cu130]",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.10",
]

[tool.uv.sources]
# Carries PR #1042 (https://github.com/kohya-ss/musubi-tuner/pull/1042) ahead of upstream main;
# re-pin to kohya-ss/musubi-tuner main once it merges.
musubi-tuner = { git = "https://github.com/rockerBOO/musubi-tuner.git", branch = "compute-loss-reduction" }

# torch/torchvision come from musubi-tuner's cu130 optional-dependency group (see
# ../others/musubi-tuner/pyproject.toml); mirrors that repo's own .uv.env (UV_EXTRA=cu130).
# Without this, plain "torch" resolves to a CPU/non-index build and torchvision is never
# pulled in at all (musubi-tuner only depends on it via the cuNNN extras).
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 132
indent-width = 4

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
