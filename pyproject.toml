[project]
name = "boo-musubi-tuner"
version = "0.1.0"
description = "Training extensions (self-flow, wavelet-loss, explorative-modeling) built on musubi-tuner as a library"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "musubi-tuner",
]

[project.optional-dependencies]
cu124 = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
]
cu128 = [
    "torch>=2.7.1",
    "torchvision>=0.22.1",
]
cu130 = [
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]
cu132 = [
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]
cpu = [
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu124" },
    { extra = "cu128" },
    { extra = "cu130" },
    { extra = "cu132" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-cu132", extra = "cu132" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-cu132", extra = "cu132" },
]
musubi-tuner = { git = "https://github.com/rockerBOO/musubi-tuner.git", branch = "compute-loss-reduction" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 132
indent-width = 4

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
